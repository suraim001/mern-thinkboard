apiVersion: apps/v1
kind: Deployment
metadata:
  name: thinkboard-backend-deployment
  namespace: thinkboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      # wait for mongodb to accept connections, otherwise the backend exits on startup
      initContainers:
        - name: wait-for-mongo
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z thinkboard-mongo-service 27017; do echo waiting for mongo; sleep 2; done"]
      containers:
        - name: thinkboard-backend-container
          image: suraim001/thinkboard-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5001
          envFrom:
            - configMapRef:
                name: thinkboard-backend-config
            - secretRef:
                name: thinkboard-backend-secret
          readinessProbe:
            httpGet:
              path: /api/status
              port: 5001
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 512Mi