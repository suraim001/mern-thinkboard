apiVersion: apps/v1
kind: Deployment
metadata:
  name: thinkboard-frontend-deployment
  namespace: thinkboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: thinkboard-frontend-container
          image: suraim001/thinkboard-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          env:
            - name: BACKEND_URL
              value: http://thinkboard-backend-service:5001
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 10
          resources:
            requests:
              memory: 32Mi
              cpu: 50m
            limits:
              memory: 128Mi