apiVersion: apps/v1
kind: Deployment
metadata:
  name: thinkboard-mongo-deployment
  namespace: thinkboard
spec:
  replicas: 1
  # stop the old pod before starting a new one so two mongods never share the volume
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
    spec:
      containers:
        - name: thinkboard-mongo-container
          # 8.0 and latest refuse to start on Linux kernels 6.19-7.0.13 (SERVER-121912)
          image: mongo:7
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
          readinessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
            initialDelaySeconds: 10
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 1Gi
      volumes:
        - name: mongo-data
          persistentVolumeClaim:
            claimName: mongo-pvc
